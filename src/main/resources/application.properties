# Spring Boot Application Configuration
spring.application.name=product-crud-api

# Server Configuration
server.port=8080

# MongoDB Atlas Configuration
# Replace with your MongoDB Atlas connection string
spring.data.mongodb.uri=mongodb+srv://<username>:<password>@<cluster>.mongodb.net/<database>?retryWrites=true&w=majority
spring.data.mongodb.database=productdb

# Connection Pool Configuration
spring.data.mongodb.options.max-connection-pool-size=100
spring.data.mongodb.options.min-connection-pool-size=10
spring.data.mongodb.options.max-connection-idle-time=30000
spring.data.mongodb.options.max-connection-life-time=0

# Logging Configuration
logging.level.org.springframework.data.mongodb=INFO
logging.level.com.celfons.productcrud=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Spring Boot 3.x Virtual Threads Configuration
spring.threads.virtual.enabled=true

# JSON Configuration
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false

# Validation Configuration
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Kafka Configuration (Optional - configure when Kafka is available)
# Kafka listeners are disabled by default to allow the application to run without Kafka
kafka.listener.orders.enabled=false
kafka.listener.payments.enabled=false
kafka.listener.notifications.enabled=false

# Uncomment and configure when Kafka broker is available:
# spring.kafka.bootstrap-servers=localhost:9092
# spring.kafka.consumer.group-id=product-crud-group
# spring.kafka.consumer.auto-offset-reset=earliest
# spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer